<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Grand Stay Hotel</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="login-body">

<div class="login-wrapper">

    <div class="login-brand">

        <div class="hotel-logo">
            GS
        </div>

        <h1>Grand Stay</h1>

        <p>
            Hotel Management System
        </p>

    </div>


    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="login-subtitle">
            Sign in to manage your hotel
        </p>

        <form action="/login"
              method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>


            <button type="submit"
                    class="primary-btn">

                Sign In

            </button>

        </form>

        <p class="login-note">
            Hotel Staff Portal
        </p>

    </div>

</div>

</body>
</html>
