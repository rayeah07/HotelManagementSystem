<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Grand Stay Hotel</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <script>

        if (
            localStorage.getItem("grandStayTheme")
            === "dark"
        ) {

            document.documentElement
                    .classList.add("dark-mode");
        }

    </script>

</head>


<body class="login-page">

<div class="login-image">

    <div class="login-overlay">

        <div class="login-brand">

            <div class="big-logo">
                GS
            </div>

            <div>

                <h1>
                    GRAND STAY
                </h1>

                <span>
                    HOTEL MANAGEMENT
                </span>

            </div>

        </div>


        <div class="login-caption">

            <p class="eyebrow">
                WELCOME
            </p>

            <h2>
                Manage your hotel
                with confidence.
            </h2>

            <p>
                A simple and elegant hotel
                management system for rooms,
                bookings and guest services.
            </p>

        </div>

    </div>

</div>


<div class="login-panel">

    <div class="login-card">

        <div class="mobile-logo">
            GS
        </div>

        <p class="eyebrow">
            ADMIN PORTAL
        </p>

        <h2>
            Welcome back
        </h2>

        <p class="login-subtitle">
            Sign in to continue to Grand Stay.
        </p>


        <form method="POST"
              action="/login">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>


            <button
                type="submit"
                class="btn primary full">

                Sign In

            </button>

        </form>


        <p class="login-hint">
            Administrator access
        </p>

    </div>

</div>

</body>

</html>
