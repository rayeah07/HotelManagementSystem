<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rooms | Grand Stay</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                GS
            </div>

            <div>
                <strong>Grand Stay</strong>
                <span>HOTEL</span>
            </div>

        </div>


        <nav>

            <a href="/dashboard.html">
                <span>⌂</span>
                Dashboard
            </a>

            <a class="active"
               href="/rooms.html">

                <span>▦</span>
                Rooms

            </a>

            <a href="/booking.html">

                <span>＋</span>
                New Booking

            </a>

            <a href="/bookings.html">

                <span>☷</span>
                Booking History

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="hotel-info">

                <strong>Grand Stay Hotel</strong>

                <small>
                    8 Floors · 24 Rooms
                </small>

            </div>

            <a href="/" class="logout">
                Logout
            </a>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>

                <p class="eyebrow">
                    HOTEL MANAGEMENT
                </p>

                <h1>Rooms</h1>

            </div>

            <a href="/booking.html"
               class="top-button">

                + New Booking

            </a>

        </header>


        <div class="room-summary">

            <div>
                <strong>24</strong>
                <span>Total Rooms</span>
            </div>

            <div>
                <strong>8</strong>
                <span>Floors</span>
            </div>

            <div>
                <strong>16</strong>
                <span>Single Rooms</span>
            </div>

            <div>
                <strong>8</strong>
                <span>Deluxe Rooms</span>
            </div>

        </div>


        <div class="legend">

            <span>
                <i class="dot available-dot"></i>
                Available
            </span>

            <span>
                <i class="dot booked-dot"></i>
                Booked
            </span>

        </div>


        <div id="roomsContainer">

            <div class="loading">
                Loading rooms...
            </div>

        </div>

    </main>

</div>


<script>

async function loadRooms() {

    try {

        const response =
            await fetch("/all-rooms");

        const rooms =
            await response.json();


        const container =
            document.getElementById(
                "roomsContainer"
            );

        container.innerHTML = "";


        for (let floor = 1;
             floor <= 8;
             floor++) {


            const floorRooms =
                rooms.filter(
                    room =>
                        room.floor === floor
                );


            const section =
                document.createElement(
                    "section"
                );

            section.className =
                "floor-section";


            section.innerHTML = `

                <div class="floor-title">

                    <div>

                        <span>
                            FLOOR ${floor}
                        </span>

                        <h2>
                            ${floor === 1
                                ? "Ground Floor"
                                : "Floor " + floor}
                        </h2>

                    </div>

                    <small>
                        ${floorRooms.length}
                        Rooms
                    </small>

                </div>

                <div class="room-grid"
                     id="floor-${floor}">
                </div>

            `;


            container.appendChild(section);


            const grid =
                section.querySelector(
                    ".room-grid"
                );


            floorRooms.forEach(room => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "room-card " +
                    (room.available
                        ? "available-room"
                        : "booked-room");


                card.innerHTML = `

                    <div class="room-card-top">

                        <div class="large-room-number">
                            ${room.roomNumber}
                        </div>

                        <span class="status-pill
                            ${room.available
                                ? "available"
                                : "booked"}">

                            ${room.available
                                ? "Available"
                                : "Booked"}

                        </span>

                    </div>


                    <div class="room-card-body">

                        <h3>
                            ${room.type} Room
                        </h3>

                        <p>
                            ${room.type === "Single"
                                ? "Comfortable room for one guest"
                                : "Premium room with extra comfort"}
                        </p>

                        <strong>
                            ₹${Number(
                                room.price
                            ).toLocaleString("en-IN")}
                            <small>/ night</small>
                        </strong>

                    </div>


                    ${
                        room.available
                        ?

                        `<a class="room-book-btn"
                           href="/booking.html?room=${room.roomNumber}">
                            Book This Room →
                         </a>`

                        :

                        `<div class="room-booked-label">
                            Currently Occupied
                         </div>`
                    }

                `;


                grid.appendChild(card);

            });

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "roomsContainer"
        ).innerHTML =
            `<div class="error">
                Unable to load rooms.
             </div>`;

    }

}


loadRooms();

setInterval(
    loadRooms,
    10000
);

</script>

</body>
</html>
