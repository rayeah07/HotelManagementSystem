<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Rooms - Grand Stay</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <script>

        if (
            localStorage.getItem("grandStayTheme")
            === "dark"
        ) {

            document.documentElement
                    .classList.add("dark-mode");
        }

    </script>

</head>


<body>

<div class="app-shell">


    <aside class="sidebar">

        <div class="brand">
            GRAND STAY
            <span>HOTEL</span>
        </div>


        <nav>

            <a href="/dashboard.html">
                <span>⌂</span>
                Dashboard
            </a>

            <a class="active"
               href="/rooms.html">
                <span>▦</span>
                Rooms
            </a>

            <a href="/booking.html">
                <span>＋</span>
                New Booking
            </a>

            <a href="/bookings.html">
                <span>☷</span>
                Booking History
            </a>

            <a href="/settings.html">
                <span>⚙</span>
                Settings
            </a>

        </nav>

    </aside>


    <main class="main">


        <div class="topbar">

            <div>

                <p class="eyebrow">
                    HOTEL INVENTORY
                </p>

                <h1>
                    Rooms
                </h1>

            </div>


            <button
                class="theme-btn"
                onclick="toggleTheme()">

                ☾

            </button>

        </div>


        <div class="room-summary">

            <div>
                <span>Total</span>
                <strong id="total">0</strong>
            </div>

            <div>
                <span>Available</span>
                <strong id="available">0</strong>
            </div>

            <div>
                <span>Occupied</span>
                <strong id="occupied">0</strong>
            </div>

        </div>


        <div id="roomsContainer">

            Loading rooms...

        </div>


    </main>

</div>


<script>

function toggleTheme() {

    const dark =
        document.documentElement
                .classList.toggle(
                    "dark-mode"
                );

    localStorage.setItem(
        "grandStayTheme",
        dark ? "dark" : "light"
    );
}


function money(value) {

    return "₹" +
        Number(value || 0)
            .toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2
                }
            );
}


async function loadRooms() {

    try {

        const response =
            await fetch(
                "/all-rooms?x=" +
                Date.now()
            );


        const rooms =
            await response.json();


        if (!Array.isArray(rooms)) {

            throw new Error(
                "Unable to load rooms."
            );
        }


        const available =
            rooms.filter(
                room =>
                    room.available
            ).length;


        document.getElementById(
            "total"
        ).textContent =
            rooms.length;


        document.getElementById(
            "available"
        ).textContent =
            available;


        document.getElementById(
            "occupied"
        ).textContent =
            rooms.length -
            available;


        const floors = {};


        rooms.forEach(
            room => {

                if (!floors[room.floor]) {

                    floors[room.floor] =
                        [];
                }


                floors[room.floor]
                    .push(room);
            }
        );


        let html = "";


        Object.keys(floors)
            .sort(
                (a,b) =>
                    Number(a) -
                    Number(b)
            )
            .forEach(
                floor => {

                    html +=

                        '<section class="floor-section">' +

                        '<div class="floor-heading">' +

                        '<div>' +

                        '<p class="eyebrow">' +
                        'FLOOR' +
                        '</p>' +

                        '<h2>' +
                        floor +
                        '</h2>' +

                        '</div>' +

                        '<span>' +
                        floors[floor].length +
                        ' rooms' +
                        '</span>' +

                        '</div>' +

                        '<div class="room-grid">';


                    floors[floor]
                        .forEach(
                            room => {

                                html +=

                                    '<div class="room-card ' +
                                    (
                                        room.available
                                            ? "available"
                                            : "occupied"
                                    ) +
                                    '">' +

                                    '<div class="room-number">' +

                                    room.roomNumber +

                                    '</div>' +

                                    '<div>' +

                                    '<h3>' +
                                    room.roomType +
                                    '</h3>' +

                                    '<p>' +
                                    money(room.price) +
                                    ' / night</p>' +

                                    '</div>' +

                                    '<span class="room-status">' +

                                    (
                                        room.available
                                            ? "Available"
                                            : "Occupied"
                                    ) +

                                    '</span>' +

                                    '</div>';
                            }
                        );


                    html +=
                        '</div></section>';
                }
            );


        document.getElementById(
            "roomsContainer"
        ).innerHTML =
            html;


    } catch (error) {

        document.getElementById(
            "roomsContainer"
        ).innerHTML =

            '<div class="empty">' +
            'Unable to load rooms.' +
            '</div>';

        console.error(error);
    }
}


loadRooms();

setInterval(
    loadRooms,
    5000
);

</script>

</body>

</html>
