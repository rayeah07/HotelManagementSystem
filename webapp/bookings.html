<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Booking History - Grand Stay</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <script>

        if (
            localStorage.getItem("grandStayTheme")
            === "dark"
        ) {

            document.documentElement
                    .classList.add("dark-mode");
        }

    </script>

</head>


<body>

<div class="app-shell">


    <aside class="sidebar">

        <div class="brand">
            GRAND STAY
            <span>HOTEL</span>
        </div>


        <nav>

            <a href="/dashboard.html">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="/rooms.html">
                <span>▦</span>
                Rooms
            </a>

            <a href="/booking.html">
                <span>＋</span>
                New Booking
            </a>

            <a class="active"
               href="/bookings.html">
                <span>☷</span>
                Booking History
            </a>

            <a href="/settings.html">
                <span>⚙</span>
                Settings
            </a>

        </nav>

    </aside>


    <main class="main">


        <div class="topbar">

            <div>

                <p class="eyebrow">
                    RESERVATIONS
                </p>

                <h1>
                    Booking History
                </h1>

            </div>


            <div class="top-actions">

                <button
                    class="theme-btn"
                    onclick="toggleTheme()">

                    ☾

                </button>


                <a
                    class="btn primary"
                    href="/booking.html">

                    ＋ New Booking

                </a>

            </div>

        </div>


        <div id="message"></div>


        <section class="card">

            <div id="bookingTable">

                <div class="loading">
                    Loading bookings...
                </div>

            </div>

        </section>


    </main>

</div>


<script>

function toggleTheme() {

    const dark =
        document.documentElement
                .classList.toggle(
                    "dark-mode"
                );

    localStorage.setItem(
        "grandStayTheme",
        dark ? "dark" : "light"
    );
}


function escapeText(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}


function money(value) {

    return "₹" +
        Number(value || 0)
            .toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );
}


const urlParams =
    new URLSearchParams(
        window.location.search
    );


if (
    urlParams.get("success")
) {

    document.getElementById(
        "message"
    ).innerHTML =

        '<div class="message success-message">' +

        escapeText(
            urlParams.get("success")
        ) +

        '</div>';
}


async function loadBookings() {

    try {

        const response =
            await fetch(
                "/booking-history?x=" +
                Date.now()
            );


        const data =
            await response.json();


        if (
            data.error
        ) {

            throw new Error(
                data.error
            );
        }


        const container =
            document.getElementById(
                "bookingTable"
            );


        if (
            !Array.isArray(data)
                ||
            data.length === 0
        ) {

            container.innerHTML =

                '<div class="empty">' +

                'No bookings found.' +

                '</div>';

            return;
        }


        let html =

            '<div class="table-wrap">' +

            '<table class="data-table">' +

            '<thead>' +

            '<tr>' +

            '<th>ID</th>' +
            '<th>Guest</th>' +
            '<th>Room</th>' +
            '<th>Stay</th>' +
            '<th>Charges</th>' +
            '<th>Status</th>' +
            '<th>Actions</th>' +

            '</tr>' +

            '</thead>' +

            '<tbody>';


        data.forEach(
            booking => {

                const roomTotal =
                    Number(
                        booking.total || 0
                    );


                const serviceTotal =
                    Number(
                        booking.serviceTotal || 0
                    );


                const grandTotal =
                    roomTotal +
                    serviceTotal;


                const id =
                    Number(
                        booking.bookingId || 0
                    );


                html +=

                    '<tr>' +

                    '<td>' +

                    '<strong>#' +
                    id +
                    '</strong>' +

                    '</td>' +


                    '<td>' +

                    '<strong>' +

                    escapeText(
                        booking.name
                    ) +

                    '</strong>' +

                    '<br>' +

                    '<small>' +

                    escapeText(
                        booking.phone
                    ) +

                    '</small>' +

                    '</td>' +


                    '<td>' +

                    '<strong>Room ' +
                    booking.roomNumber +
                    '</strong>' +

                    '<br>' +

                    '<small>' +

                    escapeText(
                        booking.roomType
                    ) +

                    '</small>' +

                    '</td>' +


                    '<td>' +

                    booking.days +
                    ' night(s)' +

                    '<br>' +

                    '<small>' +

                    escapeText(
                        booking.bookingDate
                    ) +

                    '</small>' +

                    '</td>' +


                    '<td>' +

                    'Room: ' +
                    money(roomTotal) +

                    '<br>' +

                    'Services: ' +
                    money(serviceTotal) +

                    '<br>' +

                    '<strong>' +

                    'Total: ' +
                    money(grandTotal) +

                    '</strong>' +

                    '</td>' +


                    '<td>' +

                    '<span class="status ' +

                    (
                        booking.status === "ACTIVE"
                            ? "active"
                            : booking.status === "CHECKED_OUT"
                                ? "checked"
                                : "cancelled"
                    ) +

                    '">' +

                    escapeText(
                        booking.status
                    ) +

                    '</span>' +

                    '</td>' +


                    '<td>' +

                    '<div class="action-row">';


                if (
                    booking.status === "ACTIVE"
                ) {

                    html +=

                        '<form method="POST" ' +
                        'action="/checkout">' +

                        '<input type="hidden" ' +
                        'name="bookingId" ' +
                        'value="' +
                        id +
                        '">' +

                        '<button ' +
                        'class="btn primary" ' +
                        'type="submit">' +

                        'Checkout' +

                        '</button>' +

                        '</form>';


                    html +=

                        '<form method="POST" ' +
                        'action="/cancel-booking" ' +
                        'onsubmit="return confirm(\'Cancel this booking?\')">' +

                        '<input type="hidden" ' +
                        'name="bookingId" ' +
                        'value="' +
                        id +
                        '">' +

                        '<button ' +
                        'class="btn danger" ' +
                        'type="submit">' +

                        'Cancel' +

                        '</button>' +

                        '</form>';


                    html +=

                        '<button ' +
                        'class="btn secondary" ' +
                        'type="button" ' +
                        'onclick="openService(' +
                        id +
                        ')">' +

                        'Add Service' +

                        '</button>';
                }


                html +=

                    '<a ' +
                    'class="btn secondary" ' +
                    'href="/invoice?booking_id=' +
                    id +
                    '">' +

                    'Invoice' +

                    '</a>';


                html +=

                    '<button ' +
                    'class="btn secondary" ' +
                    'type="button" ' +
                    'onclick="showServices(' +
                    id +
                    ')">' +

                    'Services' +

                    '</button>';


                html +=

                    '</div>' +

                    '<div id="serviceBox-' +
                    id +
                    '"></div>' +

                    '</td>' +

                    '</tr>';

            }
        );


        html +=

            '</tbody>' +

            '</table>' +

            '</div>';


        container.innerHTML =
            html;


    } catch (error) {

        document.getElementById(
            "bookingTable"
        ).innerHTML =

            '<div class="empty">' +

            'Unable to load booking history: ' +

            escapeText(
                error.message
            ) +

            '</div>';

        console.error(error);
    }
}


function openService(id) {

    const box =
        document.getElementById(
            "serviceBox-" + id
        );


    box.innerHTML =

        '<div class="service-box">' +

        '<form method="POST" ' +
        'action="/room-service">' +

        '<input type="hidden" ' +
        'name="bookingId" ' +
        'value="' +
        id +
        '">' +


        '<label>Service</label>' +

        '<select ' +
        'name="serviceName" ' +
        'required ' +
        'onchange="setServicePrice(this)">' +

        '<option value="Breakfast" data-price="300">' +
        'Breakfast — ₹300' +
        '</option>' +

        '<option value="Lunch" data-price="500">' +
        'Lunch — ₹500' +
        '</option>' +

        '<option value="Dinner" data-price="600">' +
        'Dinner — ₹600' +
        '</option>' +

        '<option value="Tea / Coffee" data-price="150">' +
        'Tea / Coffee — ₹150' +
        '</option>' +

        '<option value="Extra Bed" data-price="800">' +
        'Extra Bed — ₹800' +
        '</option>' +

        '<option value="Laundry" data-price="250">' +
        'Laundry — ₹250' +
        '</option>' +

        '<option value="Room Cleaning" data-price="200">' +
        'Room Cleaning — ₹200' +
        '</option>' +

        '</select>' +


        '<label>Quantity</label>' +

        '<input ' +
        'type="number" ' +
        'name="quantity" ' +
        'min="1" ' +
        'value="1" ' +
        'required>' +


        '<input ' +
        'type="hidden" ' +
        'name="price" ' +
        'value="300">' +


        '<button ' +
        'type="submit" ' +
        'class="btn primary">' +

        'Add Service' +

        '</button>' +

        '</form>' +

        '</div>';

}


function setServicePrice(select) {

    const form =
        select.closest("form");


    const option =
        select.options[
            select.selectedIndex
        ];


    const price =
        option.dataset.price;


    form.querySelector(
        'input[name="price"]'
    ).value =
        price;
}


async function showServices(id) {

    const box =
        document.getElementById(
            "serviceBox-" + id
        );


    try {

        const response =
            await fetch(
                "/service-list?booking_id=" +
                id +
                "&x=" +
                Date.now()
            );


        const services =
            await response.json();


        if (
            !Array.isArray(services)
                ||
            services.length === 0
        ) {

            box.innerHTML =

                '<div class="service-box">' +
                'No services added.' +
                '</div>';

            return;
        }


        let html =

            '<div class="service-box">' +

            '<strong>Added Services</strong>' +

            '<div class="service-list">';


        services.forEach(
            service => {

                html +=

                    '<div class="service-item">' +

                    '<span>' +

                    escapeText(
                        service.name
                    ) +

                    ' × ' +

                    service.quantity +

                    '</span>' +

                    '<strong>' +

                    money(
                        service.total
                    ) +

                    '</strong>' +

                    '</div>';
            }
        );


        html +=
            '</div></div>';


        box.innerHTML =
            html;


    } catch (error) {

        box.innerHTML =

            '<div class="service-box">' +
            'Unable to load services.' +
            '</div>';
    }
}


loadBookings();


setInterval(
    loadBookings,
    7000
);

</script>

</body>

</html>
